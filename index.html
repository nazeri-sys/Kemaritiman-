<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Ocean Rush - Kapten Bahari</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(
        180deg,
        #07111f,
        #075985,
        #0284c7
    );
}

button,
input {
    font-family: Arial, sans-serif;
}

button {
    cursor: pointer;
}

.container {
    width: calc(100% - 24px);
    max-width: 560px;
    margin: 20px auto;
}

.card {
    background: #0f172a;
    border: 2px solid #164e63;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.ship {
    text-align: center;
    font-size: 70px;
    margin-bottom: 5px;
}

h1 {
    text-align: center;
    margin: 5px 0;
    font-size: 34px;
    color: #67e8f9;
}

h2 {
    text-align: center;
    color: #fde68a;
}

.subtitle {
    text-align: center;
    color: #67e8f9;
    font-size: 12px;
    font-weight: bold;
}

.description {
    text-align: center;
    color: #cbd5e1;
    line-height: 1.6;
    font-size: 14px;
}

.label {
    display: block;
    margin: 15px 0 7px;
    color: #67e8f9;
    font-size: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #0891b2;
    background: #020617;
    color: white;
    font-size: 16px;
}

.levels {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
}

.level-btn {
    min-height: 100px;
    padding: 10px;
    border-radius: 15px;
    border: 2px solid #334155;
    background: #1e293b;
    color: white;
    text-align: left;
}

.level-btn.selected {
    background: #0891b2;
    border-color: #67e8f9;
}

.level-title {
    font-weight: bold;
    margin-bottom: 6px;
}

.level-desc {
    font-size: 10px;
    color: #cbd5e1;
}

.main-btn {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    border: 0;
    border-radius: 15px;
    background: linear-gradient(
        90deg,
        #fbbf24,
        #10b981
    );
    color: #0f172a;
    font-size: 18px;
    font-weight: bold;
}

.sound-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #22d3ee;
    background: #0f172a;
    color: white;
    font-size: 20px;
}

.topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    padding: 12px;
    background: #020617;
    border-radius: 15px;
}

.stat small {
    display: block;
    color: #94a3b8;
    font-size: 9px;
    text-transform: uppercase;
}

.stat strong {
    font-size: 22px;
}

.timer {
    text-align: right;
    color: #34d399;
}

.streak {
    padding: 6px 9px;
    border-radius: 20px;
    background: #fbbf24;
    color: #111827;
    font-weight: bold;
}

.hidden {
    display: none !important;
}

.timer-track {
    width: 100%;
    height: 10px;
    margin-top: 10px;
    background: #020617;
    border-radius: 20px;
    overflow: hidden;
}

.timer-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        #34d399,
        #fbbf24,
        #ef4444
    );
}

.progress-box {
    margin-top: 12px;
    padding: 10px;
    background: #020617;
    border-radius: 12px;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    color: #67e8f9;
    font-size: 9px;
}

.progress-track {
    height: 8px;
    margin-top: 6px;
    background: #1e293b;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0;
    background: #22d3ee;
}

.question {
    min-height: 150px;
    margin-top: 15px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 20px;
    background: #1e293b;
    border: 2px solid #164e63;
}

.question-text {
    white-space: pre-line;
    font-size: 28px;
    font-weight: bold;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
}

.answer {
    min-height: 70px;
    border-radius: 15px;
    border: 2px solid #334155;
    background: #1e293b;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.answer.correct {
    background: #15803d;
    border-color: #86efac;
}

.answer.wrong {
    background: #b91c1c;
    border-color: #fca5a5;
}

.answer:disabled {
    cursor: default;
}

.report-icon {
    text-align: center;
    font-size: 65px;
}

.report-name {
    text-align: center;
    color: #67e8f9;
    font-weight: bold;
}

.report-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 15px;
}

.report-box {
    padding: 14px;
    text-align: center;
    border-radius: 14px;
    background: #020617;
}

.report-box small {
    display: block;
    color: #94a3b8;
    font-size: 9px;
}

.report-box strong {
    display: block;
    margin-top: 5px;
    font-size: 24px;
}

.diagnostic {
    margin-top: 14px;
    padding: 15px;
    border-radius: 15px;
    background: #082f49;
    color: #e2e8f0;
    font-size: 13px;
    line-height: 1.5;
}

.footer {
    text-align: center;
    color: #bae6fc;
    font-size: 10px;
    margin: 10px;
}

@media(max-width:430px) {

    .levels {
        grid-template-columns: 1fr;
    }

    .level-btn {
        min-height: auto;
    }

    h1 {
        font-size: 28px;
    }

    .question-text {
        font-size: 24px;
    }

    .answer {
        min-height: 65px;
        font-size: 20px;
    }
}
</style>
</head>

<body>

<button
    id="soundButton"
    class="sound-btn"
    type="button">
    🔊
</button>

<div class="container">

<!-- ================= START ================= -->

<main
    id="startScreen"
    class="card screen active">

    <div class="ship">🚢</div>

    <h1>Math Ocean Rush</h1>

    <div class="subtitle">
        KAPTEN BAHARI
    </div>

    <p class="description">
        Taklukkan soal matematika dan jadilah
        Nahkoda Legendaris!
    </p>

    <label
        class="label"
        for="playerName">
        Nama Nahkoda
    </label>

    <input
        id="playerName"
        type="text"
        maxlength="30"
        value="Kapten Bahari"
        placeholder="Masukkan nama...">

    <label class="label">
        Pilih Level
    </label>

    <div class="levels">

        <button
            type="button"
            class="level-btn selected"
            data-level="1">

            <div class="level-title">
                🏝️ Dermaga
            </div>

            <div class="level-desc">
                Tambah & Kurang
            </div>

        </button>

        <button
            type="button"
            class="level-btn"
            data-level="2">

            <div class="level-title">
                🌊 Laut Lepas
            </div>

            <div class="level-desc">
                Kali & Bagi
            </div>

        </button>

        <button
            type="button"
            class="level-btn"
            data-level="3">

            <div class="level-title">
                ⚡ Badai HOTS
            </div>

            <div class="level-desc">
                Soal Cerita
            </div>

        </button>

    </div>

    <button
        id="startButton"
        type="button"
        class="main-btn">

        🚀 BERLAYAR SEKARANG

    </button>

</main>


<!-- ================= GAME ================= -->

<main
    id="gameScreen"
    class="card screen">

    <div class="topbar">

        <div class="stat">
            <small>Skor</small>
            <strong id="score">0</strong>
        </div>

        <div
            id="streakBox"
            class="streak hidden">

            🔥
            <span id="streak">0</span>x

        </div>

        <div class="stat timer">
            <small>Waktu</small>
            <strong id="timer">45s</strong>
        </div>

    </div>

    <div class="timer-track">

        <div
            id="timerBar"
            class="timer-bar">
        </div>

    </div>

    <div class="progress-box">

        <div class="progress-label">
            <span>🏝️ START</span>
            <span>🚢 JELAJAH</span>
            <span>⚓ SELESAI</span>
        </div>

        <div class="progress-track">

            <div
                id="progressBar"
                class="progress-fill">

        </div>

    </div>

    <div class="question">

        <div
            id="questionText"

            0 + 0 = ?

        </div>

</main>


<!-- ================= REPORT ================= -->

<main
    id="reportScreen"
    class="card screen">

    <div class="report-icon">
        ⚓
    </div>

    <h2>
        Laporan Pelayaran
    </h2>

    <div
        id="reportName"
        class="report-name">

        Kapten Bahari

    </div>

    <div class="report-grid">

        <div class="report-box">
            <small>Total Skor</small>
            <strong id="reportScore">0</strong>
        </div>

        <div class="report-box">
            <small>Akurasi</small>
            <strong id="reportAccuracy">0%</strong>
        </div>

        <div class="report-box">
            <small>Soal</small>
            <strong id="reportAnswered">0</strong>
        </div>

        <div class="report-box">
            <small>Streak</small>
            <strong id="reportMaxStreak">0x</strong>
        </div>

    </div>

    <div
        id="diagnostic"
        class="diagnostic">

        Evaluasi akan muncul di sini.

    </div>

    <button
        id="restartButton"
        type="button"
        class="main-btn">

        🔄 BERLAYAR KEMBALI

    </button>

</main>

</div>

<div class="footer">
    Math Ocean Rush • IMPACT 2026
</div>


<script>

"use strict";

/* =========================================
   DATA GAME
========================================= */

var playerName = "Kapten Bahari";
var selectedLevel = 1;

var score = 0;
var streak = 0;
var maxStreak = 0;

var totalAnswered = 0;
var correctAnswers = 0;

var timeLeft = 45;

var currentAnswer = 0;

var gameActive = false;

var timerInterval = null;

var muted = false;


/* =========================================
   ELEMENT
========================================= */

var startScreen =
    document.getElementById("startScreen");

var gameScreen =
    document.getElementById("gameScreen");

var reportScreen =
    document.getElementById("reportScreen");

var playerNameInput =
    document.getElementById("playerName");

var startButton =
    document.getElementById("startButton");

var restartButton =
    document.getElementById("restartButton");

var soundButton =
    document.getElementById("soundButton");

var scoreElement =
    document.getElementById("score");

var streakElement =
    document.getElementById("streak");

var streakBox =
    document.getElementById("streakBox");

var timerElement =
    document.getElementById("timer");

var timerBar =
    document.getElementById("timerBar");

var progressBar =
    document.getElementById("progressBar");

var questionText =
    document.getElementById("questionText");

var answersContainer =
    document.getElementById("answers");


/* =========================================
   TAMPILAN
========================================= */

function showScreen(screen) {

    startScreen.classList.remove("active");

    gameScreen.classList.remove("active");

    reportScreen.classList.remove("active");

    screen.classList.add("active");
}


/* =========================================
   RANDOM
========================================= */

function randomInt(min, max) {

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

}


/* =========================================
   ACAK JAWABAN
========================================= */

function shuffle(array) {

    for (
        var i = array.length - 1;
        i > 0;
        i--
    ) {

        var j =
            Math.floor(Math.random() * (i + 1));

        var temp = array[i];

        array[i] = array[j];

        array[j] = temp;
    }

    return array;
}


/* =========================================
   SOUND
========================================= */

function playSound(type) {

    if (muted) {
        return;
    }

    /*
       Sound dibuat aman.
       Kalau HP tidak mendukung audio,
       game tetap berjalan.
    */

    try {

        var AudioClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioClass) {
            return;
        }

        var audio =
            new AudioClass();

        var oscillator =
            audio.createOscillator();

        var gain =
            audio.createGain();

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        var frequency = 440;

        if (type === "correct") {
            frequency = 700;
        }

        if (type === "wrong") {
            frequency = 180;
        }

        oscillator.frequency.value =
            frequency;

        gain.gain.value = 0.05;

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.15
        );

    } catch (error) {

        console.log(
            "Sound tidak tersedia."
        );

    }
}


/* =========================================
   BUAT PILIHAN JAWABAN
========================================= */

function createOptions(correct) {

    var options = [correct];

    while (options.length < 4) {

        var difference =
            randomInt(
                1,
                Math.max(
                    3,
                    Math.ceil(
                        Math.abs(correct) * 0.2
                    ) + 2
                )
            );

        var wrong;

        if (Math.random() < 0.5) {

            wrong =
                correct + difference;

        } else {

            wrong =
                correct - difference;

        }

        if (wrong < 0) {
            wrong =
                correct + difference;
        }

        if (
            options.indexOf(wrong) === -1
        ) {

            options.push(wrong);

        }

    }

    return shuffle(options);
}


/* =========================================
   BUAT SOAL
========================================= */

function generateQuestion() {

    var a;
    var b;
    var answer;
    var text;


    /* LEVEL 1 */

    if (selectedLevel === 1) {

        a = randomInt(10, 60);

        b = randomInt(5, 40);

        if (Math.random() < 0.5) {

            answer = a + b;

            text =
                a +
                " + " +
                b +
                " = ?";

        } else {

            if (b > a) {

                var temp = a;

                a = b;

                b = temp;

            }

            answer = a - b;

            text =
                a +
                " − " +
                b +
                " = ?";

        }

    }


    /* LEVEL 2 */

    else if (selectedLevel === 2) {

        a = randomInt(2, 12);

        b = randomInt(2, 10);

        if (Math.random() < 0.5) {

            answer = a * b;

            text =
                a +
                " × " +
                b +
                " = ?";

        } else {

            answer = b;

            text =
                (a * b) +
                " ÷ " +
                a +
                " = ?";

        }

    }


    /* LEVEL 3 */

    else {

        var type =
            randomInt(1, 3);


        if (type === 1) {

            var kapal =
                randomInt(3, 8);

            var peti =
                randomInt(4, 12);

            answer =
                kapal * peti;

            text =
                "🚢 " +
                kapal +
                " kapal membawa " +
                peti +
                " peti.\n\n" +
                "Berapa peti semuanya?";

        }


        else if (type === 2) {

            var total =
                randomInt(30, 80);

            var dipakai =
                randomInt(10, 25);

            answer =
                total - dipakai;

            text =
                "⚓ Persediaan kapal " +
                total +
                " unit.\n\n" +
                "Dipakai " +
                dipakai +
                " unit.\n" +
                "Berapa sisanya?";

        }


        else {

            var kapal2 =
                randomInt(2, 6);

            var peti2 =
                randomInt(5, 12);

            var tambahan =
                randomInt(5, 15);

            answer =
                kapal2 * peti2 +
                tambahan;

            text =
                "🌊 " +
                kapal2 +
                " kapal membawa " +
                peti2 +
                " peti.\n\n" +
                "Ditambah " +
                tambahan +
                " peti.\n" +
                "Berapa totalnya?";

        }

    }


    currentAnswer = answer;

    questionText.textContent =
        text;


    /* PILIHAN */

    answersContainer.innerHTML = "";

    var options =
        createOptions(answer);


    options.forEach(
        function(option) {

            var button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "answer";

            button.textContent =
                option;

            button.addEventListener(
                "click",
                function() {

                    checkAnswer(
                        option,
                        button
                    );

                }
            );

            answersContainer.appendChild(
                button
            );

        }
    );


    progressBar.style.width =
        (
            totalAnswered / 10 * 100
        ) + "%";

}


/* =========================================
   JAWABAN
========================================= */

function checkAnswer(
    answer,
    clickedButton
) {

    if (!gameActive) {
        return;
    }

    gameActive = false;

    var buttons =
        answersContainer.querySelectorAll(
            ".answer"
        );

    buttons.forEach(
        function(button) {

            button.disabled = true;

        }
    );


    totalAnswered++;


    if (answer === currentAnswer) {

        correctAnswers++;

        streak++;

        if (streak > maxStreak) {

            maxStreak = streak;

        }

        score +=
            10 +
            ((streak - 1) * 2);

        clickedButton.classList.add(
            "correct"
        );

        playSound("correct");

    }


    else {

        streak = 0;

        clickedButton.classList.add(
            "wrong"
        );

        buttons.forEach(
            function(button) {

                if (
                    Number(
                        button.textContent
                    ) === currentAnswer
                ) {

                    button.classList.add(
                        "correct"
                    );

                }

            }
        );

        playSound("wrong");

    }


    scoreElement.textContent =
        score;

    streakElement.textContent =
        streak;

    if (streak > 0) {

        streakBox.classList.remove(
            "hidden"
        );

    } else {

        streakBox.classList.add(
            "hidden"
        );

    }


    progressBar.style.width =
        (
            totalAnswered / 10 * 100
        ) + "%";


    setTimeout(
        function() {

            if (
                totalAnswered >= 10 ||
